on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  build-standalone-waf:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - run: apt update
      
      - name: Install dependencies
        run: >
          apt install -y
          g++
          gettext
          git
          intltool
          libboost-iostreams-dev
          libboost-system-dev
          libcurl4-gnutls-dev
          libeigen3-dev
          libfftw3-dev
          libglib2.0-dev
          libgtkmm-3.0-dev
          libjack-jackd2-dev
          liblilv-dev
          liblrdf0-dev
          libsndfile1-dev
          pkgconf
          python-is-python3
          python3
          sassc
      
      - uses: actions/checkout@v2
        with:
          submodules: recursive
          
      - name: Build
        run: |
          cd trunk
          ./waf configure --prefix=/usr --no-avahi --no-bluez --no-nsm --includeresampler --includeconvolver --optimization
          ./waf build
          
  build-standalone-cmake:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - run: apt update

      - name: Install dependencies
        run: >
          apt install -y
          cmake
          ninja-build
          g++
          gettext
          git
          intltool
          libboost-iostreams-dev
          libboost-system-dev
          libcurl4-gnutls-dev
          libeigen3-dev
          libfftw3-dev
          libglib2.0-dev
          libgtkmm-3.0-dev
          libjack-jackd2-dev
          liblilv-dev
          liblrdf0-dev
          libsndfile1-dev
          pkgconf
          python-is-python3
          python3
          sassc

      - uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: Build
        run: |
          cd trunk
          cmake -B build
          cmake --build build --target gxw_demo
          cmake --build build --target gx_head
